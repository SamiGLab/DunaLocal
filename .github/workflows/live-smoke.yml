name: Live Worker HTTP smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  public-preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        origin:
          - https://lokmira.samiayten-hu.workers.dev
          - https://dunalocal.samiayten-hu.workers.dev
    env:
      LOKMIRA_PREVIEW_ORIGIN: ${{ matrix.origin }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check real workers.dev website from GitHub
        run: node scripts/live-smoke.mjs
