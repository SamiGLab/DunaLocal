name: Live Worker HTTP smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  public-preview:
    # Worker previews are deployed independently; do not require source parity on every Pages push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        origin:
          - https://lokmira.samiayten-hu.workers.dev
          - https://dunalocal.samiayten-hu.workers.dev
    env:
      LOKMIRA_PREVIEW_ORIGIN: ${{ matrix.origin }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check real workers.dev website from GitHub
        run: node scripts/live-smoke.mjs
  custom-domain:
    runs-on: ubuntu-latest
    env:
      LOKMIRA_PREVIEW_ORIGIN: https://lokmira.com
      LOKMIRA_ALLOW_GITHUB_PAGES_HEADERS: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify lokmira.com content parity and private-path 404 isolation
        run: node scripts/live-smoke.mjs
