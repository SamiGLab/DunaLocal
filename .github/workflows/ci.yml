name: Preview quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Build isolated Cloudflare Pages output
        run: node scripts/build.mjs
      - name: Check no private files are copied
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/robots.txt
          test ! -e dist/docs
          test ! -e dist/social
          test ! -e dist/scripts
      - name: Verify content and preview safeguards
        run: node scripts/verify.mjs
      - name: Validate editable SVG social graphics
        run: python3 scripts/verify_svgs.py
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Browser QA at five viewport widths
        run: node scripts/browser-smoke.mjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
