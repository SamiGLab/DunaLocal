name: Preview quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check pages.js
          node --check scripts/browser-smoke.mjs
      - name: Build isolated Cloudflare Pages output
        run: node scripts/build.mjs
      - name: Ensure committed deploy assets match sources
        run: |
          git diff --exit-code -- dist/
          test -z "$(git ls-files --others --exclude-standard dist/)"
      - name: Check no private files are copied
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/pages.css
          test -f dist/icons/search.svg
          test -f dist/icons/megaphone.svg
          test -f dist/icons/users.svg
          test -f dist/icons/chart-no-axes-combined.svg
          test -f dist/icons/LICENSE
          test -f dist/pages.js
          test -f dist/hu/szolgaltatasok/index.html
          test -f dist/en/services/index.html
          test -f dist/hu/kapcsolat/index.html
          test -f dist/en/contact/index.html
          test -f dist/hu/helyi-seo/index.html
          test -f dist/en/local-seo/index.html
          test -f dist/404.html
          test ! -e dist/docs
          test ! -e dist/social
          test ! -e dist/scripts
      - name: Verify content and preview safeguards
        run: node scripts/verify.mjs
      - name: Validate editable SVG social graphics
        run: python3 scripts/verify_svgs.py
      - name: Validate Lokmira brand vectors and deploy parity
        run: python3 scripts/verify_brand_svgs.py
      - name: Verify Wrangler Worker deployment bundle (no upload)
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-check
      - name: Dry-run renamed Lokmira Worker configuration (no deployment)
        run: npx --yes wrangler@4 deploy --config wrangler.lokmira.jsonc --dry-run --outdir .wrangler-lokmira-check
      - name: Verify live Worker headers, URL and private-path isolation
        continue-on-error: true
        run: bash scripts/check-live.sh
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Browser QA at five viewport widths
        run: node scripts/browser-smoke.mjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
