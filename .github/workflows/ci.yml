name: Preview quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify content and preview safeguards
        run: node scripts/verify.mjs
      - name: Validate editable SVG social graphics
        run: python3 scripts/verify_svgs.py
