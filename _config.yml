# GitHub Pages / Jekyll isolation safeguard
# Prevents internal documentation, scripts, draft assets, and config files
# from being rendered or published if GitHub Pages branch deployment is active.
include:
  - site.webmanifest
  - manifest.json
  - llms.txt
  - llms-full.txt
  - 4b8c9d2e1a3f507b9c8e7d6a5b4c3d2e.txt

exclude:
  - AGENTS.md
  - README.md
  - wrangler.jsonc
  - wrangler.lokmira.jsonc
  - _headers
  - dist
  - docs
  - scripts
  - social
  - design
  - node_modules
  - qa-screenshots
  - qa-artifacts
  - home
